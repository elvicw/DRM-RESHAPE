name: Windows Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure
        run: cmake -S . -B build -A x64 -DDRMRESHAPE_BUILD_TESTS=ON
      - name: Build and validate
        run: |
          cmake --build build --config Release --parallel 2 --target DRMRESHAPE_VST3 DRMRESHAPE_Standalone DRMRESHAPE_DSPTests
          ctest --test-dir build -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Compress-Archive -Path build/DRMRESHAPE_artefacts/Release/VST3/DRM-RESHAPE.vst3,build/DRMRESHAPE_artefacts/Release/Standalone/DRM-RESHAPE.exe,README.md -DestinationPath release/DRM-RESHAPE-Windows-x64.zip
      - name: Capture plugin window
        shell: pwsh
        run: |
          $app = Start-Process -FilePath build/DRMRESHAPE_artefacts/Release/Standalone/DRM-RESHAPE.exe -PassThru
          $window = Get-Process -Id $app.Id
          for ($i = 0; $i -lt 20 -and $window.MainWindowHandle -eq [IntPtr]::Zero; $i++) {
            Start-Sleep -Seconds 1
            $window.Refresh()
          }
          if ($window.MainWindowHandle -eq [IntPtr]::Zero) { throw 'Standalone plugin window did not open.' }
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class WindowBounds {
            [StructLayout(LayoutKind.Sequential)] public struct Rect { public int Left, Top, Right, Bottom; }
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr handle, out Rect rect);
            [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr handle);
          }
          '@
          [WindowBounds]::SetForegroundWindow($window.MainWindowHandle) | Out-Null
          $rect = New-Object WindowBounds+Rect
          if (-not [WindowBounds]::GetWindowRect($window.MainWindowHandle, [ref]$rect)) { throw 'Unable to read plugin window bounds.' }
          $width = $rect.Right - $rect.Left
          $height = $rect.Bottom - $rect.Top
          if ($width -lt 400 -or $height -lt 300) { throw "Unexpected plugin window size: ${width}x${height}." }
          $bitmap = [System.Drawing.Bitmap]::new($width, $height)
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bitmap.Size)
          $bitmap.Save('release/DRM-RESHAPE-Screenshot.png', [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose(); $bitmap.Dispose()
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body: |
            ## DRM-RESHAPE ${{ github.ref_name }}

            Drum-focused minimum-phase EQ and tone shaping by yeahwaah audio.

            ### What’s included

            - Six editable bands: LOW, MID, HIGH, TIGHT, SMOOTH, and AIR.
            - Kick, Snare, Toms, Overheads, Room, and Full Kit starting points.
            - Optional frequency-selective dynamic TIGHT and SMOOTH processing.
            - Stereo-linked compression and soft saturation Drive macros.
            - Wet/dry blend, input/output trim, level compensation, bypass, and pre/post spectrum display.
            - Vintage hardware-style interface with three rotary treatments and analog input/output/reduction meters.
            - Windows x64 VST3 and Standalone builds.

            ### Validation

            Windows VST3 and Standalone builds passed. DSP checks cover EQ response, stability, parameter updates, dynamic EQ and compressor reduction, saturation behavior, and a bounded CPU run.

            ### Screenshot

            ![DRM-RESHAPE plugin interface](https://github.com/elvicw/DRM-RESHAPE/releases/download/${{ github.ref_name }}/DRM-RESHAPE-Screenshot.png)
          files: release/*
